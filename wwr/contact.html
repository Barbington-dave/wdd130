<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Dry Oar Rafting Co.</title>
    <meta name="description"
      content="Experience the thrill of white water rafting, from rushing rapids and exciting challenges to breathtaking scenery and unforgettable adventures.">
    <meta name="author" content="David Inkoom">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-raftingcompas.jpg" alt="Water Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <h1>Contact Us</h1>
        <section class="company-details-header">
            <h2>White Water Rafting Co.</h2>
            <p>123 River Run Way, Cascade, Idaho</p>
            <p>(555) 123-4567</p>
            <p>info@whitewaterrafting.com</p>
            <div class="contact-grid">
                <section class="company-info">
                    <h3>Our Location</h3>
                    <div class="map-container">
                        <iframe
                          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2822.414467385412!2d-116.03713062347716!3d44.957647710777!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x54a5038f4d9b3d0d%3A0x4a1e95e803f26f2a!2sCascade%2C%20ID%2083611!5e0!3m2!1sen!2sus!4v1680000000000!5m2!1sen!2sus"
                          allowfullscreen="" loading="lazy"
                          referrerpolicy="no-referrer-when-downgrade"></iframe>
                    </div>
                </section>
                <section class="contact-form-section">
                    <h3>Send Us a Message</h3>
                    <form action="#" method="post">
                        <div class="form-item">
                            <label for="fullname">Your Name:</label>
                            <input type="text" id="fullname" name="fullname" required>
                        </div>

                        <div class="form-item">
                            <label for="useremail">Email Address:</label>
                            <input type="email" id="useremail" name="useremail" required>
                        </div>

                        <fieldset class="radio-group">
                            <legend>Purpose of Message:</legend>
                            <div>
                                <input type="radio" id="general" name="purpose" value="general"
                                  checked>
                                <label for="general">General Inquiry</label>
                            </div>
                            <div>
                                <input type="radio" id="reservation" name="purpose"
                                  value="reservation">
                                <label for="reservation">Reservation Question</label>
                            </div>
                            <div>
                                <input type="radio" id="suggestion" name="purpose"
                                  value="suggestion">
                                <label for="suggestion">Website Suggestion</label>
                            </div>
                        </fieldset>

                        <div class="form-item">
                            <label for="message">Message:</label>
                            <textarea id="message" name="message" rows="4" required></textarea>
                        </div>

                        <div class="checkbox-item">
                            <input type="checkbox" id="subscribe" name="subscribe">
                            <label for="subscribe">Please subscribe me to the monthly
                                newsletter</label>
                        </div>

                        <button type="submit" class="submit-btn">Send Message</button>
                    </form>
                </section>
                <section class="employee-profiles">
                    <h2>Meet Our Team</h2>
                    <div class="profiles-container">
                        <figure>
                            <img src="images/bruce-winston.jpg" alt="Bruce Winston, Head Guide">
                            <figcaption>Mark Winston<br><strong>Head Guide</strong></figcaption>
                        </figure>
                        <figure>
                            <img src="images/marcus-chen.jpg" alt="Marcus Chen, Safety Coordinator">
                            <figcaption>Marcus Chen<br><strong>Safety Coordinator</strong>
                            </figcaption>
                        </figure>
                        <figure>
                            <img src="images/emily-davis.jpg" alt="Emily Davis, Customer Relations">
                            <figcaption>Emily Davis<br><strong>Customer Relations</strong>
                            </figcaption>
                        </figure>
                    </div>
                </section>
            </div>
    </main>
    <footer>
        <p>&copy; 2026 White Water Rafting Co. | David Inkoom</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank">
                <img src="images/facebook.svg" alt="Facebook Icon" class="social-icon">
            </a>
            <a href="https://linkedin.com" target="_blank">
                <img src="images/linkedin.svg" alt="LinkedIn Icon" class="social-icon">
            </a>
            <a href="https://instagram.com" target="_blank">
                <img src="images/instagram.svg" alt="Instagram Icon" class="social-icon">
            </a>
        </nav>
    </footer>
</body>

</html>
